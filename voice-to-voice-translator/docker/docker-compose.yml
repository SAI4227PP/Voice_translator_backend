services:
  model-downloader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.downloader
    volumes:
      - voice-models:/app/models
    environment:
      - ARGOS_PACKAGES_DIR=/app/models/translate/argos-packages
      - PYTHONUNBUFFERED=1
    container_name: voice-translator-downloader
    restart: "no"
    command: python scripts/download_models.py

  voice-translator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: voice-translator-app
    ports:
      - "7860:7860"
    volumes:
      - voice-models:/app/models
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - DEBUG=False
      - ARGOS_PACKAGES_DIR=/app/models/translate/argos-packages
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - XDG_CACHE_HOME=/tmp
      - HOME=/app
      - SPACY_NO_DOWNLOADS=1
      - PIP_NO_INPUT=1
      - PIP_USER=0
      - STT_ENABLE_WARM_START=True
      - STT_PRELOAD_LANGUAGES=en,hi
      - TRANSLATION_ENABLE_WARM_START=True
      - TRANSLATION_WARM_START_MODE=common
      - TRANSLATION_COMMON_PAIRS=en-hi,hi-en,en-bn,bn-en
      - TTS_ENABLE_WARM_START=True
      - TTS_PRELOAD_LANGUAGES=en,hi,bn,ta
    restart: unless-stopped
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  voice-models:
    name: voice-models
